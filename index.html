document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

50%, 18px) scale(1) rotate(-6deg); opacity: 1; }\n    80%  { transform: translate(-50%, -14px) scale(1) rotate(3deg); opacity: 1; }\n    100% { transform: translate(-50%, 0px) scale(1) rotate(0deg); opacity: 1; }\n  }\n  @keyframes confettiFall { 0% { transform: translateY(-20px) rotate(0); opacity: 1; } 100% { transform: translateY(660px) rotate(720deg); opacity: 0; } }\n\n  /* ---- responsive (mobile-first phone usage) ---- */\n  .ring { transform-origin: top center; }\n  .papel { transform-origin: top center; }\n  @media (max-width: 760px) {\n    .ring { transform: scale(.62); }\n    .ringwrap { height: 348px; }\n    .hero { padding: 40px 18px 4px !important; }\n    .gifthead { margin-top: 30px !important; }\n  }\n  @media (max-width: 480px) {\n    .papel { transform: scale(.66); }\n    .ring { transform: scale(.5); }\n    .ringwrap { height: 282px; }\n    .h1 { font-size: 34px !important; }\n    .kicker { font-size: 17px !important; }\n    .sub { font-size: 15px !important; }\n    .hero { padding: 34px 16px 2px !important; }\n    .gifthead { margin-top: 22px !important; }\n    .stage { height: 560px !important; }\n  }\n  @media (max-width: 360px) {\n    .ring { transform: scale(.44); }\n    .ringwrap { height: 248px; }\n    .h1 { font-size: 30px !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"position: relative; width: 100%; min-height: 100vh; overflow: hidden; background: radial-gradient(120% 90% at 50% -10%, #FFFDF8 0%, #FFF1DF 45%, #FFE3CC 100%); font-family: 'Hanken Grotesk', sans-serif; color: #3A241A; padding-bottom: 120px;\">\n\n  <!-- soft color glows -->\n  <div style=\"position: absolute; top: -60px; right: -40px; width: 460px; height: 460px; border-radius: 50%; background: radial-gradient(circle, rgba(232,76,125,.22), transparent 70%); filter: blur(20px); pointer-events: none; animation: pulseGlow 7s ease-in-out infinite;\"><\u002Fdiv>\n  <div style=\"position: absolute; bottom: 40px; left: -80px; width: 460px; height: 460px; border-radius: 50%; background: radial-gradient(circle, rgba(31,168,154,.20), transparent 70%); filter: blur(20px); pointer-events: none; animation: pulseGlow 9s ease-in-out infinite;\"><\u002Fdiv>\n\n  <!-- flying beer bottles (subtle background, animated via WAAPI) -->\n  <div data-bottles=\"\" style=\"position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;\">\n    <sc-for list=\"{{ bottles }}\" as=\"b\" hint-placeholder-count=\"7\">\n      <div data-bottle=\"\" style=\"position: absolute; top: {{ b.top }}; left: 0; opacity: {{ b.op }}; will-change: transform;\">\n        <div style=\"position: relative; width: 24px; height: 52px;\">\n          <div style=\"position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 10px; height: 5px; background: linear-gradient(#E0BE55, #BD9320); border-radius: 2px 2px 1px 1px;\"><\u002Fdiv>\n          <div style=\"position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 8px; height: 13px; background: linear-gradient(90deg, #7A3F12, #B9701F 55%, #6E370F); border-radius: 3px 3px 0 0;\"><\u002Fdiv>\n          <div style=\"position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 20px; height: 37px; background: linear-gradient(90deg, #6E370F, #B9701F 42%, #DC9A47 56%, #6E370F); border-radius: 8px 8px 6px 6px; box-shadow: inset -2px 0 3px rgba(0,0,0,.25), inset 2px -1px 3px rgba(255,255,255,.18);\"><\u002Fdiv>\n          <div style=\"position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 16px; height: 13px; background: #F4E6C6; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(150,100,40,.25);\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- papel picado banner -->\n  <div class=\"papel\" style=\"position: relative; z-index: 3; display: flex; justify-content: center; gap: 0; padding: 0 12px; transform-origin: top center;\">\n    <sc-for list=\"{{ flags }}\" as=\"flag\" hint-placeholder-count=\"9\">\n      <div style=\"width: 64px; height: 78px; background: {{ flag.color }}; margin: 0 1px; clip-path: polygon(0 0,100% 0,100% 70%,50% 100%,0 70%); box-shadow: inset 0 -8px 0 rgba(0,0,0,.06); position: relative;\">\n        <div style=\"position: absolute; top: 16px; left: 50%; transform: translateX(-50%); width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,.45);\"><\u002Fdiv>\n        <div style=\"position: absolute; top: 42px; left: 14px; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.4);\"><\u002Fdiv>\n        <div style=\"position: absolute; top: 42px; right: 14px; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.4);\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- hero heading -->\n  <div class=\"hero\" style=\"position: relative; z-index: 3; text-align: center; max-width: 900px; margin: 0 auto; padding: 54px 24px 8px;\">\n    <div class=\"kicker\" style=\"display: inline-block; font-family: 'Permanent Marker', cursive; color: #E8602C; font-size: 20px; letter-spacing: 1px; transform: rotate(-2deg); margin-bottom: 14px;\">¡Feliz Cumpleaños!<\u002Fdiv>\n    <h1 class=\"h1\" style=\"font-family: 'Caprasimo', serif; font-weight: 400; font-size: clamp(40px, 7vw, 86px); line-height: 1.02; margin: 0; color: #3A241A; text-wrap: balance;\">\n      Alles Gute zum Geburtstag<br>\n      <span style=\"color: #E84C7D;\">mein akh Philipp<\u002Fspan>\n    <\u002Fh1>\n    <p class=\"sub\" style=\"font-size: clamp(16px, 2vw, 20px); color: #8A6A55; margin: 22px auto 0; max-width: 560px; text-wrap: pretty;\">Ein paar schöne Momente — und ganz unten wartet eine kleine Überraschung auf dich.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- photo ring -->\n  <div style=\"position: relative; z-index: 3; text-align: center; margin: 30px auto 0; max-width: 1000px; padding: 0 24px;\">\n    <div style=\"font-family: 'Permanent Marker', cursive; color: #1FA89A; font-size: 18px; transform: rotate(-1.5deg);\">Unsere Erinnerungen<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"ringwrap\" style=\"position: relative; z-index: 3; width: 100%; overflow: hidden;\">\n  <div class=\"ring\" style=\"position: relative; width: 760px; height: 560px; margin: 8px auto 0;\">\n    <sc-for list=\"{{ photos }}\" as=\"p\" hint-placeholder-count=\"8\">\n      <div style=\"position: absolute; left: calc(50% + {{ p.x }}); top: calc(50% + {{ p.y }}); transform: translate(-50%, -50%);\">\n        <div style=\"animation: floaty {{ p.dur }} ease-in-out infinite; animation-delay: {{ p.delay }};\">\n          <div style=\"transform: rotate({{ p.rot }}); background: #FFFEFB; padding: 9px 9px 30px; border-radius: 6px; box-shadow: 0 16px 32px -12px rgba(58,36,26,.35), 0 2px 6px rgba(58,36,26,.12); width: 150px;\">\n            <div style=\"position: relative; width: 132px; height: 150px; overflow: hidden; border-radius: 4px; background: #EFE7DC;\">\n              <img src=\"{{ p.src }}\" alt=\"Foto von Philipp\" style=\"position: absolute; max-width: none; transform: translate(-50%, -50%); width: {{ p.w }}; height: {{ p.h }}; left: {{ p.l }}; top: {{ p.t }};\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <!-- center medallion -->\n    <div style=\"position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 132px; height: 132px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFD27A, #F2A93B 70%); box-shadow: 0 14px 30px -8px rgba(242,169,59,.6); display: flex; align-items: center; justify-content: center; text-align: center; animation: floaty 5s ease-in-out infinite;\">\n      <span style=\"font-family: 'Caprasimo', serif; color: #fff; font-size: 46px; line-height: 1; text-shadow: 0 2px 0 rgba(180,110,20,.4);\">★<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- gift -->\n  <div class=\"gifthead\" style=\"position: relative; z-index: 3; text-align: center; margin: 46px auto 0; max-width: 760px; padding: 0 24px;\">\n    <h2 style=\"font-family: 'Caprasimo', serif; font-weight: 400; font-size: clamp(28px, 4vw, 44px); margin: 0; color: #3A241A;\">{{ giftHeadline }}<\u002Fh2>\n    <p style=\"font-family: 'Permanent Marker', cursive; color: #E8602C; font-size: 18px; min-height: 22px; margin: 8px 0 0;\">{{ promptText }}<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"stage\" style=\"position: relative; z-index: 3; width: 100%; max-width: 720px; height: 600px; margin: 0 auto;\">\n\n    <!-- CLOSED gift -->\n    <sc-if value=\"{{ closed }}\" hint-placeholder-val=\"{{ true }}\">\n      <div onclick=\"{{ open }}\" role=\"button\" tabindex=\"0\" style=\"position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 240px; height: 200px; cursor: pointer; z-index: 4;\">\n        <div style=\"position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); width: 200px; height: 36px; background: radial-gradient(ellipse, rgba(232,96,44,.35), transparent 70%); filter: blur(6px); animation: pulseGlow 4s ease-in-out infinite;\"><\u002Fdiv>\n        <div style=\"position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 200px; height: 132px; border-radius: 8px; background: linear-gradient(160deg, #F06B3A 0%, #D8451F 100%); box-shadow: 0 22px 36px -14px rgba(216,69,31,.6), inset 0 -10px 18px rgba(0,0,0,.12);\">\n          <div style=\"position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 38px; height: 100%; background: linear-gradient(90deg, #F2A93B, #FFC766 50%, #F2A93B); box-shadow: inset 2px 0 4px rgba(0,0,0,.1), inset -2px 0 4px rgba(0,0,0,.1);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position: absolute; top: -10px; left: 50%; transform: translateX(-50%);\">\n          <div style=\"position: relative; width: 226px; height: 58px; border-radius: 8px; background: linear-gradient(160deg, #F47A4C 0%, #E04E26 100%); box-shadow: 0 8px 16px -6px rgba(0,0,0,.35), inset 0 -6px 10px rgba(0,0,0,.12);\">\n            <div style=\"position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 38px; height: 100%; background: linear-gradient(90deg, #F2A93B, #FFC766 50%, #F2A93B);\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position: absolute; top: -34px; left: 50%; transform: translateX(-50%); width: 90px; height: 40px;\">\n            <div style=\"position: absolute; left: 0; top: 4px; width: 42px; height: 34px; border-radius: 50% 50% 50% 50% / 70% 70% 40% 40%; background: linear-gradient(135deg, #FFC766, #F2A93B); transform: rotate(-22deg); box-shadow: inset -3px -3px 6px rgba(0,0,0,.12);\"><\u002Fdiv>\n            <div style=\"position: absolute; right: 0; top: 4px; width: 42px; height: 34px; border-radius: 50% 50% 50% 50% / 70% 70% 40% 40%; background: linear-gradient(225deg, #FFC766, #F2A93B); transform: rotate(22deg); box-shadow: inset 3px -3px 6px rgba(0,0,0,.12);\"><\u002Fdiv>\n            <div style=\"position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFD98A, #E8932B); box-shadow: inset 0 -2px 4px rgba(0,0,0,.18);\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- OPENED gift -->\n    <sc-if value=\"{{ opened }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 7;\">\n        <sc-for list=\"{{ confetti }}\" as=\"c\" hint-placeholder-count=\"0\">\n          <div data-anim=\"confetti\" style=\"position: absolute; top: 50px; left: {{ c.left }}; width: {{ c.size }}; height: {{ c.size }}; background: {{ c.color }}; border-radius: {{ c.radius }}; opacity: 0;\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 240px; height: 200px; z-index: 4;\">\n        <div style=\"position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); width: 200px; height: 36px; background: radial-gradient(ellipse, rgba(232,96,44,.35), transparent 70%); filter: blur(6px);\"><\u002Fdiv>\n        <div style=\"position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 200px; height: 132px; border-radius: 8px; background: linear-gradient(160deg, #E8602C 0%, #C53C18 100%); box-shadow: 0 22px 36px -14px rgba(216,69,31,.6), inset 0 14px 22px rgba(0,0,0,.28);\">\n          <div style=\"position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 38px; height: 100%; background: linear-gradient(90deg, #F2A93B, #FFC766 50%, #F2A93B);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-anim=\"lid\" style=\"position: absolute; top: -10px; left: 50%; transform: translateX(-50%); opacity: 0;\">\n          <div style=\"position: relative; width: 226px; height: 58px; border-radius: 8px; background: linear-gradient(160deg, #F47A4C 0%, #E04E26 100%); box-shadow: 0 8px 16px -6px rgba(0,0,0,.35), inset 0 -6px 10px rgba(0,0,0,.12);\">\n            <div style=\"position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 38px; height: 100%; background: linear-gradient(90deg, #F2A93B, #FFC766 50%, #F2A93B);\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position: absolute; top: -34px; left: 50%; transform: translateX(-50%); width: 90px; height: 40px;\">\n            <div style=\"position: absolute; left: 0; top: 4px; width: 42px; height: 34px; border-radius: 50% 50% 50% 50% / 70% 70% 40% 40%; background: linear-gradient(135deg, #FFC766, #F2A93B); transform: rotate(-22deg);\"><\u002Fdiv>\n            <div style=\"position: absolute; right: 0; top: 4px; width: 42px; height: 34px; border-radius: 50% 50% 50% 50% / 70% 70% 40% 40%; background: linear-gradient(225deg, #FFC766, #F2A93B); transform: rotate(22deg);\"><\u002Fdiv>\n            <div style=\"position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFD98A, #E8932B);\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-anim=\"cap\" style=\"position: absolute; top: 250px; left: 50%; z-index: 6; opacity: 1; transform: translate(-50%, 0);\">\n        <div style=\"position: relative; width: 280px; height: 280px; border-radius: 50%; background: repeating-conic-gradient(from -8.571deg, #F0D279 0deg 8.571deg, #B07F12 8.571deg 17.143deg); box-shadow: 0 30px 50px -16px rgba(120,80,10,.55); display: flex; align-items: center; justify-content: center;\">\n          <div style=\"position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 38% 30%, rgba(255,255,255,.45), rgba(255,255,255,0) 52%); pointer-events: none;\"><\u002Fdiv>\n          <div style=\"position: relative; width: 210px; height: 210px; border-radius: 50%; background: radial-gradient(circle at 40% 34%, #F6CB61 0%, #E2A833 64%, #C68A1F 100%); box-shadow: inset 0 3px 7px rgba(255,255,255,.5), inset 0 -10px 18px rgba(120,70,10,.4), 0 0 0 4px rgba(120,80,10,.16); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px;\">\n            <div style=\"font-family: 'Permanent Marker', cursive; color: #6E4310; font-size: 14px; letter-spacing: 3px; line-height: 1;\">GUTSCHEIN<\u002Fdiv>\n            <div style=\"font-family: 'Caprasimo', serif; color: #A2331A; font-size: 60px; line-height: .9; margin: 1px 0 4px; text-shadow: 0 1px 0 rgba(255,255,255,.45);\">50&nbsp;€<\u002Fdiv>\n            <div style=\"font-family: 'Permanent Marker', cursive; color: #5C3A12; font-size: 15px; line-height: 1.3; max-width: 170px; text-wrap: balance;\">Mexicaner-Essen<br>+ Bregenz-Tour<br>an einem Wochenende<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <button onclick=\"{{ reset }}\" style=\"position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); border: none; background: none; cursor: pointer; font-family: 'Hanken Grotesk', sans-serif; font-size: 14px; font-weight: 600; color: #B07A55; text-decoration: underline; text-underline-offset: 3px; z-index: 8;\">nochmal einpacken<\u002Fbutton>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { opened: false, confetti: [] };\n\n  // stable references (built once at construction) so renderVals output\n  // is identical between renders unless state actually changes\n  flags = [\n    { color: '#E84C7D' }, { color: '#F2A93B' }, { color: '#1FA89A' },\n    { color: '#E8602C' }, { color: '#7A5CC7' }, { color: '#E84C7D' },\n    { color: '#1FA89A' }, { color: '#F2A93B' }, { color: '#E8602C' }\n  ];\n\n  photos = (() => {\n    const N = 8, Rx = 300, Ry = 210, rots = [-9, 7, -5, 8, -7, 6, -8, 5], durs = [5, 6, 5.5, 6.5, 5.2, 6.2, 5.8, 6.8];\n    // baked-in photo crops (cover framing preserved from the editor)\n    const frame = [\n      { w: '100%', h: '155.92%', l: '50%', t: '50%' },\n      { w: '151.52%', h: '100%', l: '50%', t: '50%' },\n      { w: '151.52%', h: '100%', l: '50%', t: '50%' },\n      { w: '100%', h: '117.33%', l: '50%', t: '50%' },\n      { w: '151.52%', h: '100%', l: '50%', t: '50%' },\n      { w: '100%', h: '155.92%', l: '50%', t: '50%' },\n      { w: '151.52%', h: '100%', l: '50%', t: '50%' },\n      { w: '100%', h: '155.92%', l: '50%', t: '50%' }\n    ];\n    return Array.from({ length: N }, (_, i) => {\n      const a = (-90 + i * (360 / N)) * Math.PI / 180;\n      return {\n        id: 'phillip-foto-' + (i + 1),\n        src: (typeof window !== 'undefined' && window.PHILIPP_PHOTOS && window.PHILIPP_PHOTOS[i]) || ('foto-' + (i + 1) + '.webp'),\n        w: frame[i].w, h: frame[i].h, l: frame[i].l, t: frame[i].t,\n        x: Math.round(Math.cos(a) * Rx) + 'px',\n        y: Math.round(Math.sin(a) * Ry) + 'px',\n        rot: rots[i] + 'deg',\n        dur: durs[i] + 's',\n        delay: (i * 0.35).toFixed(2) + 's'\n      };\n    });\n  })();\n\n  bottles = Array.from({ length: 7 }, (_, i) => ({\n    key: i,\n    top: (5 + i * 12.8).toFixed(1) + '%',\n    op: (0.20 + (i % 3) * 0.06).toFixed(2)\n  }));\n\n  _bottleAnims = [];\n\n  makeConfetti() {\n    const palette = ['#E84C7D', '#F2A93B', '#1FA89A', '#E8602C', '#7A5CC7', '#FFC766'];\n    return Array.from({ length: 40 }, (_, i) => ({\n      key: i,\n      left: Math.round(Math.random() * 100) + '%',\n      size: (6 + Math.round(Math.random() * 9)) + 'px',\n      color: palette[i % palette.length],\n      radius: Math.random() > .5 ? '50%' : '2px',\n      dur: (1.9 + Math.random() * 1.7).toFixed(2) + 's',\n      delay: (Math.random() * .6).toFixed(2) + 's'\n    }));\n  }\n\n  open = () => { if (!this.state.opened) this.setState({ opened: true, confetti: this.makeConfetti() }); };\n  reset = () => { this.setState({ opened: false, confetti: [] }); };\n\n  componentDidMount() {\n    requestAnimationFrame(() => this.startBottles());\n    this._onResize = () => { clearTimeout(this._rt); this._rt = setTimeout(() => this.startBottles(), 250); };\n    window.addEventListener('resize', this._onResize);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onResize);\n    this._bottleAnims.forEach((a) => { try { a.cancel(); } catch (e) {} });\n  }\n\n  startBottles() {\n    this._bottleAnims.forEach((a) => { try { a.cancel(); } catch (e) {} });\n    this._bottleAnims = [];\n    const vw = document.documentElement.clientWidth || window.innerWidth || 390;\n    document.querySelectorAll('[data-bottle]').forEach((el, i) => {\n      if (!el.animate) return;\n      const rtl = i % 2 === 1;\n      const from = rtl ? vw + 50 : -50;\n      const to = rtl ? -50 : vw + 50;\n      const mid = (from + to) / 2;\n      const tilt = rtl ? 16 : -16;\n      const dur = 17000 + Math.random() * 16000;\n      const a = el.animate([\n        { transform: 'translate(' + from + 'px, 0px) rotate(' + tilt + 'deg)' },\n        { transform: 'translate(' + mid + 'px, -18px) rotate(' + (tilt * 0.35) + 'deg)', offset: 0.5 },\n        { transform: 'translate(' + to + 'px, 0px) rotate(' + tilt + 'deg)' }\n      ], { duration: dur, iterations: Infinity, easing: 'ease-in-out', delay: -Math.random() * dur });\n      this._bottleAnims.push(a);\n    });\n  }\n\n  componentDidUpdate(prevProps, prevState) {\n    if (prevState && !prevState.opened && this.state.opened) {\n      // CSS keyframe animations don't auto-start reliably in this runtime,\n      // so drive the reveal explicitly with the Web Animations API.\n      requestAnimationFrame(() => requestAnimationFrame(() => this.playReveal()));\n    }\n  }\n\n  playReveal() {\n    const tort = document.querySelector('[data-anim=\"cap\"]');\n    if (tort && tort.animate) {\n      tort.animate([\n        { transform: 'translate(-50%, -70px) scale(.2) rotate(-40deg)', opacity: 0, offset: 0 },\n        { transform: 'translate(-50%, -250px) scale(1.05) rotate(12deg)', opacity: 1, offset: .35 },\n        { transform: 'translate(-50%, 18px) scale(1) rotate(-6deg)', opacity: 1, offset: .62 },\n        { transform: 'translate(-50%, -14px) scale(1) rotate(3deg)', opacity: 1, offset: .8 },\n        { transform: 'translate(-50%, 0px) scale(1) rotate(0deg)', opacity: 1, offset: 1 }\n      ], { duration: 1250, delay: 150, easing: 'cubic-bezier(.34,1.3,.5,1)', fill: 'both' });\n    }\n    const lid = document.querySelector('[data-anim=\"lid\"]');\n    if (lid && lid.animate) {\n      lid.animate([\n        { transform: 'translateX(-50%) translate(0px, 0px) rotate(0deg)', opacity: 1 },\n        { transform: 'translateX(-50%) translate(-84px, -240px) rotate(-36deg)', opacity: 0 }\n      ], { duration: 850, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'both' });\n    }\n    document.querySelectorAll('[data-anim=\"confetti\"]').forEach((c) => {\n      if (!c.animate) return;\n      c.animate([\n        { transform: 'translateY(-20px) rotate(0deg)', opacity: 1 },\n        { transform: 'translateY(660px) rotate(720deg)', opacity: 0 }\n      ], { duration: 1900 + Math.random() * 1700, delay: Math.random() * 600, easing: 'cubic-bezier(.3,.2,.7,1)', fill: 'forwards' });\n    });\n  }\n\n  renderVals() {\n    const opened = this.state.opened;\n    return {\n      flags: this.flags,\n      photos: this.photos,\n      bottles: this.bottles,\n      confetti: this.state.confetti,\n      opened, closed: !opened,\n      giftHeadline: opened ? 'Überraschung!' : 'Dein Geschenk',\n      promptText: opened ? 'Lass es dir schmecken — ich freu mich drauf!' : 'tipp auf das Geschenk ↓',\n      open: this.open,\n      reset: this.reset\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
